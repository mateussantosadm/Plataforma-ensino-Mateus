function login(signup=false){app.innerHTML=`<section class="card authbox"><div class="eyebrow">Acesso individual</div><h1>${signup?'Solicitar acesso':'Entrar na plataforma'}</h1><p>${signup?'Informe seu nome, e-mail e crie uma senha exclusiva para a plataforma. O acesso depende de aprovação manual.':'Use sua conta previamente autorizada.'}</p><form id="authform">${signup?'<label for="name">Nome</label><input id="name" required maxlength="100" autocomplete="name">':''}<label for="email">E-mail</label><input id="email" required type="email" autocomplete="email"><label for="password">Senha</label><input id="password" required type="password" minlength="8" autocomplete="${signup?'new-password':'current-password'}"><button class="btn full" type="submit">${signup?'Cadastrar e solicitar':'Entrar'}</button></form><p id="authmsg" role="status"></p><button class="btn secondary full" id="switch">${signup?'Já tenho conta':'Solicitar acesso'}</button></section>`;
$('switch').onclick=()=>login(!signup);$('authform').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const email=$('email').value.trim(),password=$('password').value;const r=signup?await client.auth.signUp({email,password,options:{data:{name:$('name').value.trim()},emailRedirectTo:location.origin+location.pathname}}):await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(r.data.session){await check();}else $('authmsg').textContent='Cadastro recebido. Entre na plataforma para solicitar sua autorização. Se houver pedido de confirmação de e-mail, verifique as configurações com o administrador.';}catch(err){if($('authmsg'))$('authmsg').textContent='Não foi possível continuar. Confira os dados e tente novamente.';}finally{b.disabled=false;}};}
function invalidate(){clearInterval(tick);location.reload();}
exit.onclick=async()=>{const r=await client.auth.signOut({scope:'local'});if(r.error){alert('Não foi possível encerrar a sessão. Tente novamente.');return;}invalidate();};
async function showAdmin(){if(!admin)return;const r=await client.from('osm_requests').select('user_id,name,email,status,requested_at').order('requested_at',{ascending:false});if(r.error){alert('Não foi possível carregar solicitações.');return;}app.innerHTML='<section class="card"><h1>Autorizações</h1><p>Gerencie as solicitações individuais.</p><button class="btn secondary" id="admin-back">Voltar</button><div id="requests"></div></section>';$('admin-back').onclick=()=>launched?window.home():check();const list=$('requests');if(!r.data.length)list.textContent='Nenhuma solicitação.';for(const p of r.data){const row=document.createElement('div');row.className='adminline';const h=document.createElement('strong');h.textContent=p.name;const detail=document.createElement('p');detail.textContent=p.email+' · '+labels[p.status];row.append(h,detail);for(const [status,label] of [['approved','Aprovar'],['denied','Recusar'],['blocked','Bloquear']]){if(status===p.status||p.user_id===user.id)continue;const b=document.createElement('button');b.className='btn secondary';b.textContent=label;b.onclick=async()=>{b.disabled=true;const update=await client.from('osm_requests').update({status}).eq('user_id',p.user_id).select('status').single();if(update.error){alert('Não foi possível alterar a autorização.');b.disabled=false;return;}if(p.user_id===user.id&&launched&&status!=='approved'){invalidate();return;}await showAdmin();};row.append(b);}list.append(row);}}
adminBtn.onclick=showAdmin;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function countQs(p){return [...p.modules,...p.simulations].reduce((n,m)=>n+m.questions.length,0);}
async function showContents(){
 if(!admin||!launched)return;
 const [active,archive]=await Promise.all([client.from('osm_content').select('discipline,revision,content_key').eq('id',1).single(),client.from('osm_archive').select('archive_id,discipline,archived_at').order('archived_at',{ascending:false})]);
 if(active.error||archive.error){alert('Gerenciador indisponível. Confira a configuração do Supabase.');return;}
 if(active.data.revision!==activeRevision){invalidate();return;}
 const panel=el('section',undefined,'card narrow');app.replaceChildren(panel);window.scrollTo(0,0);
 panel.append(el('h1','Gerenciar conteúdos'),el('p','Apenas o administrador pode importar ou restaurar disciplinas. O conteúdo ativo só muda após sua confirmação.','muted'));
 const back=el('button','Voltar','btn secondary');back.onclick=()=>window.home();panel.append(back);
 const current=el('div',undefined,'notice');current.append(el('div','DISCIPLINA ATIVA','eyebrow'),el('h2',active.data.discipline),el('p',`${countQs(window.OSM_DATA)} questões · ${window.OSM_DATA.modules.length} quizzes · ${window.OSM_DATA.simulations.length} simulados`));panel.append(current);
 panel.append(el('h2','Importar nova disciplina'),el('p','Selecione o arquivo JSON preparado para esta plataforma. A disciplina atual será arquivada automaticamente se a importação for confirmada.','small muted'));
 const name=el('input');name.type='text';name.maxLength=100;name.placeholder='Nome da nova disciplina';name.setAttribute('aria-label','Nome da nova disciplina');name.style.cssText='display:block;width:100%;padding:12px;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)';
 const file=el('input');file.type='file';file.accept='.json,application/json';file.setAttribute('aria-label','Arquivo JSON da disciplina');file.style.cssText='display:block;max-width:100%;margin:12px 0';
 const note=el('p','Nenhum arquivo selecionado.','small muted');note.setAttribute('role','status');const activate=el('button','Arquivar atual e ativar nova','btn full');activate.disabled=true;panel.append(name,file,note,activate);
 let data=null,busy=false,selection=0;
 function enable(){activate.disabled=busy||!data||!name.value.trim();}
 name.oninput=enable;file.onchange=async()=>{const token=++selection;data=null;enable();const f=file.files[0];if(!f){note.textContent='Nenhum arquivo selecionado.';return;}try{if(f.size>5000000)throw Error('Arquivo acima de 5 MB.');const parsed=JSON.parse(await f.text());const p=parsed.payload||parsed;if(!Array.isArray(p.modules)||!p.modules.length||!Array.isArray(p.simulations)||!p.simulations.length||![...p.modules,...p.simulations].every(m=>Array.isArray(m.questions)&&m.questions.length))throw Error('Formato incompatível.');if(token!==selection)return;data=p;if(typeof parsed.discipline==='string')name.value=parsed.discipline.slice(0,100);note.textContent=`Arquivo lido: ${countQs(p)} questões, ${p.modules.length} quizzes e ${p.simulations.length} simulados. A validação definitiva será feita pelo banco.`;}catch(e){if(token!==selection)return;note.textContent='Arquivo inválido: '+e.message;}enable();};
 async function change(discipline,payload,restore){if(busy)return;if(!confirm(`Ativar ${discipline}? A disciplina atual será arquivada. Os estudantes aprovados passarão a acessar o novo conteúdo.`))return;busy=true;enable();note.textContent='Validando e salvando...';const r=await client.rpc('osm_switch_content',{p_expected:active.data.revision,p_discipline:discipline,p_payload:payload,p_restore:restore});if(r.error){busy=false;note.textContent='Nenhuma troca confirmada: '+r.error.message;enable();return;}alert('Disciplina ativada. A página será atualizada.');invalidate();}
 activate.onclick=()=>{if(data&&name.value.trim())change(name.value.trim(),data,null);};
 panel.append(el('hr'),el('h2','Disciplinas arquivadas'));
 if(!archive.data.length)panel.append(el('p','Nenhuma disciplina arquivada. O conteúdo atual permanece ativo.','muted'));
 for(const item of archive.data){const row=el('div',undefined,'adminline');row.append(el('strong',item.discipline),el('p','Arquivada em '+new Date(item.archived_at).toLocaleString('pt-BR'),'small muted'));const b=el('button','Restaurar disciplina','btn secondary');b.onclick=()=>change(item.discipline,null,item.archive_id);row.append(b);panel.append(row);}
}
contentBtn.onclick=showContents;
async function check(silent=false){if(checking)return;checking=true;try{const u=await client.auth.getUser();if(u.error||!u.data.user){if(launched)invalidate();else{exit.hidden=true;adminBtn.hidden=true;contentBtn.hidden=true;if(!silent)login();}return;}user=u.data.user;exit.hidden=false;const [req,role]=await Promise.all([client.rpc('osm_request_access'),client.from('osm_admins').select('user_id').eq('user_id',user.id).maybeSingle()]);if(req.error||role.error)throw new Error('access');admin=!!role.data;adminBtn.hidden=!admin;const r=await client.from('osm_requests').select('status').eq('user_id',user.id).single();if(r.error)throw r.error;contentBtn.hidden=!(admin&&r.data.status==='approved');if(r.data.status!=='approved'){if(launched){invalidate();return;}if(!silent)message(labels[r.data.status],r.data.status==='pending'?'Seu cadastro foi recebido. Aguarde a autorização do administrador.':'Seu acesso não está liberado. Entre em contato com o administrador.',true);return;}if(launched){const v=await client.from('osm_content').select('revision').eq('id',1).single();if(v.error||v.data.revision!==activeRevision)invalidate();return;}const content=await client.from('osm_content').select('payload,discipline,content_key,revision').eq('id',1).single();if(content.error||!content.data?.payload)throw new Error('content');window.OSM_DATA=content.data.payload;window.OSM_USER_ID=user.id;window.OSM_DISCIPLINE=content.data.discipline;window.OSM_CONTENT_KEY=content.data.content_key;activeRevision=content.data.revision;const disciplineLabel=window.OSM_DISCIPLINE==='Organização, Sistemas e Métodos'?'OSM':window.OSM_DISCIPLINE;$('discipline-label').textContent='Administração · '+disciplineLabel;document.title='Plataforma de Ensino Mateus | '+disciplineLabel;$('discipline-footer').textContent='Material de apoio independente. Não é uma avaliação oficial da instituição.';const script=document.createElement('script');script.textContent=$('osm-app-code').textContent;document.body.append(script);$('theme').hidden=false;launched=true;}catch(e){if(launched)invalidate();else if(!silent)message('Não foi possível verificar o acesso','Confira sua conexão ou tente novamente.',true);}finally{checking=false;}}
client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&launched){invalidate();return;}if(['INITIAL_SESSION','SIGNED_IN','USER_UPDATED'].includes(event))setTimeout(()=>check(),0);});tick=setInterval(()=>{if(user)check(true);},30000);check();
})();
</script></body></html>
