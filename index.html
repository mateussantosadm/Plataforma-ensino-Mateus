'use strict';const D=window.OSM_DATA,A=document.querySelector('#app'),KEY=(window.OSM_CONTENT_KEY==='osm'?'mateus-osm-v3-2:':'mateus-disciplina:'+window.OSM_CONTENT_KEY+':')+window.OSM_USER_ID;let S=null,R=null,screen='home',timerHandle;const safe=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=(k)=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};// Fisher-Yates: cada permutação tem a mesma probabilidade, sem filtros no gabarito.

const pct=(n,d)=>d?Math.round(n/d*100):0;const esc=safe;const icons={quiz:'<path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0 0 4h14M8 7h8M8 11h6"/>',sim:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/>',rev:'<path d="M3 4h7a2 2 0 0 1 2 2v15a4 4 0 0 0-3-2H3zM21 4h-7a2 2 0 0 0-2 2v15a4 4 0 0 1 3-2h6z"/>'};function glyph(k){return `<div class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg></div>`}function view(s,html,scroll=true){screen=s;A.innerHTML=html;if(scroll)window.scrollTo(0,0)}function back(label='Início',call='home()'){return `<button class="back" onclick="${call}">← ${label}</button>`}function theme(t){document.documentElement.dataset.theme=t;document.querySelector('#theme').textContent=t==='dark'?'☀':'☾';write(KEY+'theme',t)}function toggleTheme(){theme(document.documentElement.dataset.theme==='dark'?'light':'dark')}theme(read(KEY+'theme')||read('mateus-osm-v2theme')||'light');function save(){if(S)write(KEY,S)}function home(){save();const old=read(KEY);view('home',`<section class="hero"><div class="eyebrow">${esc(window.OSM_DISCIPLINE)}</div><h1>${window.OSM_CONTENT_KEY==='osm'?'Estude OSM.':'Estude com foco.'}<br>Pratique com propósito.</h1><p>Questões autorais inspiradas no padrão ENADE, simulados e revisão direcionada. Escolha por onde começar.</p><div class="metrics"><span><b>${D.modules.length}</b> quizzes</span><span><b>${D.simulations.length}</b> simulados</span><span><b>${[...D.modules,...D.simulations].reduce((n,m)=>n+m.questions.length,0)}</b> questões distintas</span></div></section>${old&&old.questions?.length&&!old.finished?`<div class="card resume"><div><strong>Avaliação em andamento</strong><div class="small muted">${esc(old.title)} · ${Object.keys(old.answers||{}).length} de ${old.questions.length} respondidas</div></div><button class="btn" onclick="resume()">Continuar</button></div>`:''}<div class="sectionhead"><div class="eyebrow">Seu estudo</div><h2>Como deseja começar?</h2></div><div class="grid"><section class="card tile">${glyph('quiz')}<h2>Quizzes por assunto</h2><p>Pratique um tema de cada vez, com explicações após cada resposta.</p><button class="btn full" onclick="listing('quiz')">Escolher assunto →</button></section><section class="card tile">${glyph('sim')}<h2>Simulados gerais</h2><p>Resolva questões de diferentes conteúdos e confira o resultado ao final.</p><button class="btn full" onclick="listing('sim')">Escolher simulado →</button></section><section class="card tile">${glyph('rev')}<h2>Revisão de conteúdos</h2><p>Consulte conceitos e pontos de atenção vinculados às aulas.</p><button class="btn full" onclick="listing('rev')">Revisar conteúdos →</button></section></div><p class="small muted" style="margin-top:24px">Versão 4.1 · Questões de nível acadêmico · Alternativas com sorteio independente. Acesso individual autorizado. O progresso é armazenado neste navegador quando o armazenamento local está disponível.</p>`)}function listing(type){save();const isSim=type==='sim',isRev=type==='rev',items=isSim?D.simulations:D.modules;view(type,`${back()}<div class="eyebrow">${isSim?'Avaliação geral':isRev?'Material de apoio':'Prática por tema'}</div><h1>${isSim?'Simulados gerais':isRev?'Revisão de conteúdos':'Quizzes por assunto'}</h1><p class="muted">${isSim?'Escolha um simulado com questões de diferentes módulos.':isRev?'Escolha um assunto para consultar a síntese da aula.':'Cinco alternativas e correção imediata.'}</p><div class="grid">${items.map((m,i)=>`<section class="card modulecard"><span class="pill">${isSim?esc(m.level):'Módulo '+String(i+1).padStart(2,'0')}</span><h3 style="margin-top:13px">${esc(m.title)}</h3><p class="muted small">${isRev?'Conceitos, exemplos e referências aos slides':m.questions.length+' questões · '+(isSim?'correção ao final':'gabarito comentado')}</p><button class="btn full" onclick="${isRev?`review(${i})`:`prepare('${type}',${i})`}">${isRev?'Consultar conteúdo':isSim?'Iniciar simulado':'Iniciar quiz'} →</button></section>`).join('')}</div>`)}function confirmAction(title,text,fn){let d=document.querySelector('#confirm');document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-text').textContent=text;document.querySelector('#dialog-yes').onclick=()=>{d.close();fn()};if(d.showModal)d.showModal();else if(confirm(text))fn()}function prepare(type,i){const m=type==='sim'?D.simulations[i]:D.modules[i];view('prepare',`<div class="narrow">${back('Voltar',`listing('${type}')`)}<div class="card"><div class="eyebrow">${type==='sim'?'Simulado geral':'Quiz por assunto'}</div><h1>${esc(m.title)}</h1><p>${m.questions.length} questões de múltipla escolha. Cada questão vale um ponto. ${type==='sim'?'Você pode navegar entre as questões, alterar respostas e marcar questões para revisão antes de finalizar.':'Confirme a resposta para ver a explicação e continue para a próxima.'}</p><div class="notice"><label><input type="checkbox" id="timed"> Mostrar cronômetro (tempo decorrido, sem limite)</label><br><label><input type="checkbox" id="mix" checked> Embaralhar a ordem das questões</label><br><span class="small muted">As alternativas são sorteadas independentemente em cada questão, sem restrições de sequência ou quantidade de letras.</span></div><button class="btn full" onclick="begin('${type}',${i})">Começar avaliação</button></div></div>`)}function begin(type,i){let timed=document.querySelector('#timed').checked,mix=document.querySelector('#mix').checked,m=type==='sim'?D.simulations[i]:D.modules[i];const go=()=>start(m.questions,type,m.title,i,timed,mix);let old=read(KEY);if(old&&!old.finished&&old.questions?.length)confirmAction('Iniciar nova avaliação?','O progresso anterior será substituído.',go);else go()}function start(qs,type,title,origin,timed,mix){S={type,title,origin,timed,mix,questions:arrangeQuestions(qs,mix),answers:{},locked:{},flags:{},index:0,elapsed:0,lastTick:Date.now(),finished:false};R=null;save();renderQ()}function resume(){S=read(KEY);if(!S||S.finished)return home();S.lastTick=Date.now();renderQ()}function elapsed(){if(!S)return 0;return S.elapsed||0}function timeFmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}clearInterval(timerHandle);timerHandle=setInterval(()=>{if(screen==='question'&&S&&!S.finished){let now=Date.now(),diff=Math.max(0,Math.min(5,Math.floor((now-(S.lastTick||now))/1000)));if(diff){S.elapsed+=diff;S.lastTick=now;let t=document.querySelector('#clock');if(t)t.textContent=timeFmt(elapsed());if(S.elapsed%5===0)save()}}},1000);function answered(){return Object.keys(S.answers).length}function selectOption(i){let q=S.questions[S.index];if(S.locked[q.id])return;S.answers[q.id]=q.options[i];save();renderQ(false)}function flag(){let q=S.questions[S.index];S.flags[q.id]=!S.flags[q.id];save();renderQ(false)}function jump(i){if(i<0||i>=S.questions.length)return;S.index=i;save();renderQ()}function lock(){let q=S.questions[S.index];if(S.answers[q.id]===undefined)return;S.locked[q.id]=true;save();renderQ(false)}function countCorrect(){return S.questions.filter(q=>S.answers[q.id]===q.correct&&(S.type==='sim'||S.locked[q.id])).length}function renderQ(scroll=true){S.lastTick=Date.now();let q=S.questions[S.index],n=S.questions.length,idx=S.index,selected=S.answers[q.id],locked=S.locked[q.id],sim=S.type==='sim',ans=answered(),module=D.modules[q.module];let nav=sim?`<div class="navgrid" aria-label="Navegar entre questões">${S.questions.map((x,j)=>`<button aria-label="Questão ${j+1}${S.flags[x.id]?', marcada':''}" class="num ${S.answers[x.id]!==undefined?'done':''} ${j===idx?'current':''} ${S.flags[x.id]?'flagged':''}" onclick="jump(${j})">${j+1}</button>`).join('')}</div>`:'';view('question',`<div class="narrow">${back('Sair e salvar','home()')}<div class="card"><div class="quiztitle"><div><div class="eyebrow">${sim?'Simulado':'Quiz'} · ${esc(S.title)}</div><h2 style="margin:5px 0">Questão ${idx+1} de ${n}</h2></div>${S.timed?`<span class="timer" id="
