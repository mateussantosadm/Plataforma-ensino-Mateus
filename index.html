</style></head><body><header><div class="top"><button class="brand" onclick="if(window.OSM_DATA)home()" aria-label="Página inicial"><span class="logo">M.</span><span><strong>Plataforma de Ensino Mateus</strong><small id="discipline-label">Administração · Ambiente de estudos</small></span></button><details class="site-menu"><summary aria-label="Menu da plataforma"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></summary><div class="site-menu-panel"><button class="iconbtn" id="theme" onclick="toggleTheme()" aria-label="Alternar tema">☀  Tema claro</button><button class="btn secondary" id="admin-open" hidden>Autorizações</button><button class="btn secondary" id="content-open" hidden>Gerenciar conteúdos</button><button class="btn secondary" id="auth-out" hidden>Sair</button></div></details></div></header><main id="app"></main><footer>Plataforma de Ensino Mateus · 2026<br><span id="discipline-footer">Material de apoio independente. Não é uma avaliação oficial da instituição.</span></footer><dialog id="confirm"><h2 id="dialog-title">Finalizar avaliação?</h2><p id="dialog-text"></p><div class="row"><button class="btn" id="dialog-yes">Confirmar</button><button class="btn secondary" onclick="document.getElementById('confirm').close()">Cancelar</button></div></dialog><script>/* Tema inicial, antes da autorização. */window.toggleTheme=function(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;window.OSM_PREAUTH_THEME=t;document.getElementById('theme').textContent=t==='dark'?'☀  Tema claro':'☾  Tema escuro';};</script><script type="text/plain" id="osm-app-code">
'use strict';const D=window.OSM_DATA,A=document.querySelector('#app'),KEY=(window.OSM_CONTENT_KEY==='osm'?'mateus-osm-v3-2:':'mateus-disciplina:'+window.OSM_CONTENT_KEY+':')+window.OSM_USER_ID;let S=null,R=null,screen='home',timerHandle;const safe=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=(k)=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};// Fisher-Yates: cada permutação tem a mesma probabilidade, sem filtros no gabarito.
function randomIndex(n){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1),limit=4294967296-(4294967296%n);do{globalThis.crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)}

// A lista guarda somente IDs vistos no ciclo, por conta, disciplina e navegador.
const DRAW_SIZE=20, cycleMemory=new Map();
function bankFor(type,i){const qs=type==='sim'?D.simulations.flatMap(m=>m.questions):D.modules[i].questions;return [...new Map(qs.map(q=>[q.id,q])).values()]}
function attemptSize(type,i){return Math.min(DRAW_SIZE,bankFor(type,i).length)}
function cycleKey(type,i){return KEY+':sorteio-v1:'+(type==='sim'?'sim-compartilhado':'quiz-'+i)}
function drawQuestions(type,i){
 const pool=bankFor(type,i),limit=Math.min(DRAW_SIZE,pool.length),key=cycleKey(type,i);
 const state=read(key)||cycleMemory.get(key)||{},valid=new Set(pool.map(q=>q.id));
 let used=new Set((Array.isArray(state.used)?state.used:[]).filter(id=>valid.has(id))),picked=[],selected=new Set(),counts=new Map();
 // Prefere temas/módulos ainda pouco representados no sorteio. Sem reposição dentro do ciclo.

// Simulado personalizado: usa o banco ativo, sem criar nem alterar questões.

 const wanted=new Set(modules);

const pct=(n,d)=>d?Math.round(n/d*100):0;const esc=safe;const icons={custom:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="var(--soft)"/><circle cx="15" cy="12" r="2" fill="var(--soft)"/><circle cx="10" cy="17" r="2" fill="var(--soft)"/>',quiz:'<path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0 0 4h14M8 7h8M8 11h6"/>',sim:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/>',rev:'<path d="M3 4h7a2 2 0 0 1 2 2v15a4 4 0 0 0-3-2H3zM21 4h-7a2 2 0 0 0-2 2v15a4 4 0 0 1 3-2h6z"/>'};function glyph(k){return `<div class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg></div>`}function view(s,html,scroll=true){screen=s;document.documentElement.dataset.screen=s;A.innerHTML=html;if(scroll)window.scrollTo(0,0)}function back(label='Início',call='home()'){return `<button class="back" onclick="${call}">← ${label}</button>`}const THEME_KEY='mateus-theme-465:'+window.OSM_USER_ID;function theme(t){t=t==='light'?'light':'dark';document.documentElement.dataset.theme=t;document.querySelector('#theme').textContent=t==='dark'?'☀  Tema claro':'☾  Tema escuro';write(THEME_KEY,t)}function toggleTheme(){theme(document.documentElement.dataset.theme==='dark'?'light':'dark')}theme(read(THEME_KEY)||window.OSM_PREAUTH_THEME||'dark');function save(){if(S)write(KEY,S)}function home(){save();const old=read(KEY);view('home',`<section class="hero"><div class="eyebrow">${esc(window.OSM_DISCIPLINE)}</div><h1>Olá, ${esc(String(window.OSM_USER_NAME||'').trim().split(/\s+/)[0]||'estudante')}!</h1><p>Bem-vindo ao seu ambiente de aprendizagem. O que vamos estudar hoje?</p><div class="metrics"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-3-2-6-2-9-1v15c3-2 6-2 9 0 3-2 6-2 9 0V4c-3-1-6-1-9 1v14"/></svg><b>${D.modules.length}</b> quizzes</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-5 9 5-9 5-9-5zm0 5 9 5 9-5M3 17l9 5 9-5"/></svg><b>${D.simulations.length}</b> simulados</span><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7a4 4 0 1 1 7 3c-2 1-3 2-3 4M12 18h.01"/><circle cx="12" cy="12" r="10"/></svg><b>${[...D.modules,...D.simulations].reduce((n,m)=>n+m.questions.length,0)}</b> questões distintas</span></div></section>${old&&old.questions?.length&&!old.finished?`<div class="card resume"><div><strong>Avaliação em andamento</strong><div class="small muted">${esc(old.title)} · ${old.questions.filter(q=>old.type==='sim'?old.answers?.[q.id]!==undefined:old.locked?.[q.id]).length} de ${old.questions.length} respondidas</div></div><button class="btn" onclick="resume()">Continuar</button></div>`:''}<div class="sectionhead"><div class="eyebrow">Seu estudo</div><h2>Como deseja começar?</h2></div><div class="grid home-grid"><section class="card tile">${glyph('quiz')}<h2>Quizzes por assunto</h2><p>Pratique um tema de cada vez, com explicações após cada resposta.</p><button class="btn full" onclick="listing('quiz')">Escolher assunto →</button></section><section class="card tile">${glyph('sim')}<h2>Simulados gerais</h2><p>Resolva questões de diferentes conteúdos e confira o resultado ao final.</p><button class="btn full" onclick="listing('sim')">Escolher simulado →</button></section><section class="card tile">${glyph('custom')}<h2>Simulado personalizado</h2><p>Escolha os conteúdos e a quantidade de questões. Monte uma avaliação exclusiva para sua sessão de estudos.</p><button class="btn full" onclick="customSetup()">Montar meu simulado →</button></section><section class="card tile">${glyph('rev')}<h2>Central de Estudos</h2><p>Consulte conceitos e pontos de atenção vinculados às aulas.</p><button class="btn full" onclick="listing('rev')">Acessar Central de Estudos →</button></section></div><p class="small muted" style="margin-top:24px">Versão 4.6.6 · Questões sorteadas a cada nova tentativa · Alternativas com sorteio independente. Acesso individual autorizado. O progresso é armazenado neste navegador quando o armazenamento local está disponível.</p>`)}function listing(type){if(type==='rev')return studyHub();save();const isSim=type==='sim',isRev=type==='rev',items=isSim?D.simulations:D.modules;view(type,`${back()}<div class="eyebrow">${isSim?'Avaliação geral':isRev?'Material de apoio':'Prática por tema'}</div><h1>${isSim?'Simulados gerais':isRev?'Central de Estudos':'Quizzes por assunto'}</h1><p class="muted">${isSim?'Resolva simulados com questões de diferentes módulos e verifique seu desempenho.':isRev?'Escolha um módulo para estudar os conceitos, exemplos e esquemas de revisão.':'Cinco alternativas e correção imediata.'}</p><div class="grid">${items.map((m,i)=>`<section class="card modulecard ${isSim?'sim-card':''}"><span class="pill">${isSim?'Sorteio integrado':'Módulo '+String(i+1).padStart(2,'0')}</span><h3 style="margin-top:13px">${esc(m.title)}</h3><p class="muted small">${isRev?(m.study?.chapters?.length&&m.study?.mindmap?m.study.chapters.length+' capítulos · mapa mental · quadro comparativo':'Conceitos, exemplos e referências aos slides'):attemptSize(type,i)+' questões por tentativa · banco de '+bankFor(type,i).length+' · '+(isSim?'correção ao final':'gabarito comentado')}</p><button class="btn full" onclick="${isRev?`review(${i})`:`prepare('${type}',${i})`}">${isRev?'Consultar conteúdo':isSim?'Iniciar simulado':'Iniciar quiz'} →</button></section>`).join('')}</div>`)}function confirmAction(title,text,fn){let d=document.querySelector('#confirm');document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-text').textContent=text;document.querySelector('#dialog-yes').onclick=()=>{d.close();fn()};if(d.showModal)d.showModal();else if(confirm(text))fn()}function prepare(type,i){const m=type==='sim'?D.simulations[i]:D.modules[i];view('prepare',`<div class="narrow">${back('Voltar',`listing('${type}')`)}<div class="card"><div class="eyebrow">${type==='sim'?'Simulado geral':'Quiz por assunto'}</div><h1>${esc(m.title)}</h1><p>${attemptSize(type,i)} questões de múltipla escolha sorteadas de um banco de ${bankFor(type,i).length}. Cada questão vale um ponto. ${type==='sim'?'Você pode navegar, alterar respostas e marcar questões para revisão. A finalização será liberada após responder a todas as questões.':'Confirme cada resposta para ver a explicação. A finalização será liberada quando todas as respostas estiverem confirmadas.'}</p><div class="notice"><label><input type="checkbox" id="timed"> Mostrar cronômetro (tempo decorrido, sem limite)</label><br><span class="small muted">As questões e as cinco alternativas são sorteadas independentemente em cada nova tentativa. O sistema prioriza questões inéditas no ciclo deste navegador. Ao continuar uma avaliação, a ordem original é mantida.</span></div><button class="btn full" onclick="begin('${type}',${i})">Começar avaliação</button></div></div>`)}function begin(type,i){let timed=document.querySelector('#timed').checked,m=type==='sim'?D.simulations[i]:D.modules[i];const go=()=>start(drawQuestions(type,i),type,m.title,i,timed,true,type,i);let old=read(KEY);if(old&&!old.finished&&old.questions?.length)confirmAction('Iniciar nova avaliação?','O progresso anterior será substituído.',go);else go()}function start(qs,type,title,origin,timed,mix,bankType=type,bankOrigin=origin){S={type,title,origin,bankType,bankOrigin,timed,mix,questions:arrangeQuestions(qs,mix),answers:{},locked:{},flags:{},index:0,elapsed:0,lastTick:Date.now(),finished:false};R=null;save();renderQ()}function resume(){S=read(KEY);if(!S||S.finished)return home();S.lastTick=Date.now();renderQ()}function elapsed(){if(!S)return 0;return S.elapsed||0}function timeFmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}clearInterval(timerHandle);timerHandle=setInterval(()=>{if(screen==='question'&&S&&!S.finished){let now=Date.now(),diff=Math.max(0,Math.min(5,Math.floor((now-(S.lastTick||now))/1000)));if(diff){S.elapsed+=diff;S.lastTick=now;let t=document.querySelector('#clock');if(t)t.textContent=timeFmt(elapsed());if(S.elapsed%5===0)save()}}},1000);function answered(){return Object.keys(S.answers).length}function selectOption(i){let q=S.questions[S.index];if(S.locked[q.id])return;S.answers[q.id]=q.options[i];save();renderQ(false)}function flag(){let q=S.questions[S.index];S.flags[q.id]=!S.flags[q.id];save();renderQ(false)}function jump(i){if(i<0||i>=S.questions.length)return;S.index=i;save();renderQ()}function lock(){let q=S.questions[S.index];if(S.answers[q.id]===undefined)return;S.locked[q.id]=true;save();renderQ(false)}function countCorrect(){return S.questions.filter(q=>S.answers[q.id]===q.correct&&(S.type==='sim'||S.locked[q.id])).length}function completed(){return S.questions.filter(q=>S.type==='sim'?S.answers[q.id]!==undefined:!!S.locked[q.id]).length}

function flashDeck(i){const st=D.modules[i]?.study;if(!st)return [];const primary=[],extra=[],used=new Set();

for(const c of st.chapters||[])for(const p of c.sections||[]){const pars=p.paragraphs||[],qs=flashPrompts[p.title]||[];pars.forEach((v,j)=>add(primary,qs[j]||`Explique o aspecto ${j+1} de “${p.title}”.`,String(v).split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/),'Slides '+p.slide,p.title,p.tip||'','Conceito e aplicação'));add(extra,`Como explicar ${p.title.toLocaleLowerCase('pt-BR')} de forma integrada?`,pars,'Slides '+p.slide,c.title,p.tip,'Síntese');}
const mapCards=[];for(const map of st.mapDiagrams||[])for(const b of map.branches||[])add(mapCards,`Quais são os pontos essenciais de “${b.title}”?`,b.points||[],map.source,map.title,'','Revisão visual');
const comparisons=[];for(const row of st.comparison?.rows||[])add(comparisons,`Como interpretar “${row[0]}” no quadro comparativo?`,row.slice(1).map((v,j)=>`${st.comparison.headers[j+1]}: ${v}`),'Quadro comparativo',st.title,'','Comparação');
const final=[...primary];while(final.length<30&&(comparisons.length||extra.length||mapCards.length)){for(const a of [comparisons,extra,mapCards])if(a.length&&final.length<30)final.push(a.shift());}
for(const n of st.mindmap||[])if(final.length<30)add(final,`Como resumir “${n.label}” neste módulo?`,[n.text],'Resumo do módulo',st.title,'','Síntese');

function audioPlay(){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){audioStatus('Este navegador não oferece leitura por voz.');return;}if(audio.running){audioStop(false);return;}const voices=speechSynthesis.getVoices().filter(v=>v.localService&&/^pt(?:[-_]|$)/i.test(v.lang));const voice=voices.find(v=>/^pt[-_]BR$/i.test(v.lang))||voices[0];if(!voice){audioStatus('Nenhuma voz local em português disponível. Confira as configurações de voz do aparelho e tente novamente.');return;}if(!audio.chunks.length){const c=D.modules[studyState.i].study.chapters[studyState.chapter];audio.chunks=[c.title,...c.sections.flatMap(p=>[p.title,...p.paragraphs,p.tip])].filter(Boolean).flatMap(p=>String(p).match(/[^.!?]+[.!?]?/g)||[String(p)]).map(s=>s.trim()).filter(Boolean);audio.pos=0;}audio.running=true;let token=++audio.token;function next(){if(token!==audio.token||!audio.running)return;if(audio.pos>=audio.chunks.length){audioStop();audioStatus('Narração concluída.');return;}const u=new SpeechSynthesisUtterance(audio.chunks[audio.pos]);audio.utterance=u;u.voice=voice;u.lang=voice.lang;u.rate=Number(document.querySelector('#audio-rate')?.value||1);u.onend=()=>{if(token!==audio.token)return;audio.pos++;next();};u.onerror=()=>{if(token!==audio.token)return;audioStop(false);audioStatus('A leitura foi interrompida. Tente novamente.');};audioStatus();speechSynthesis.speak(u);}next();}

  let notice=document.getElementById('connection-status');if(!notice){notice=document.createElement('div');notice.id='connection-status';notice.setAttribute('role','status');notice.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:1000;max-width:520px;margin:auto;padding:10px 14px;border:1px solid var(--line,#456);border-radius:12px;background:var(--card,#142338);color:var(--text,#edf4ff);font-size:13px;box-shadow:0 4px 16px #0003;pointer-events:none';document.body.append(notice)}

  clearTimeout(retryTimer);retryTimer=setTimeout(()=>{retryTimer=0;check(true)},Math.min(20000,5000*2**(failures-1)));
 }
exit.onclick=async()=>{const r=await client.auth.signOut({scope:'local'});if(r.error){alert('Não foi possível encerrar a sessão. Tente novamente.');return;}invalidate(true);};
async function showAdmin(){if(!admin)return;const r=await client.from('osm_requests').select('user_id,name,email,status,requested_at').order('requested_at',{ascending:false});if(r.error){alert('Não foi possível carregar solicitações.');return;}app.innerHTML='<section class="card"><h1>Autorizações</h1><p>Gerencie as solicitações individuais.</p><button class="btn secondary" id="admin-back">Voltar</button><div id="requests"></div></section>';$('admin-back').onclick=()=>launched?window.home():check();const list=$('requests');if(!r.data.length)list.textContent='Nenhuma solicitação.';for(const p of r.data){const row=document.createElement('div');row.className='adminline';const h=document.createElement('strong');h.textContent=p.name;const detail=document.createElement('p');detail.textContent=p.email+' · '+labels[p.status];row.append(h,detail);for(const [status,label] of [['approved','Aprovar'],['denied','Recusar'],['blocked','Bloquear']]){if(status===p.status||p.user_id===user.id)continue;const b=document.createElement('button');b.className='btn secondary';b.textContent=label;b.onclick=async()=>{b.disabled=true;const update=await client.from('osm_requests').update({status}).eq('user_id',p.user_id).select('status').single();if(update.error){alert('Não foi possível alterar a autorização.');b.disabled=false;return;}if(p.user_id===user.id&&launched&&status!=='approved'){invalidate();return;}await showAdmin();};row.append(b);}list.append(row);}}

function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function countQs(p){return [...p.modules,...p.simulations].reduce((n,m)=>n+m.questions.length,0);}
async function showContents(){
 if(!admin||!launched)return;
 const [active,archive]=await Promise.all([client.from('osm_content').select('discipline,revision,content_key').eq('id',1).single(),client.from('osm_archive').select('archive_id,discipline,archived_at').order('archived_at',{ascending:false})]);
 if(active.error||archive.error){alert('Gerenciador indisponível. Confira a configuração do Supabase.');return;}
 if(active.data.revision!==activeRevision){invalidate();return;}
 const panel=el('section',undefined,'card narrow');app.replaceChildren(panel);window.scrollTo(0,0);
 panel.append(el('h1','Gerenciar conteúdos'),el('p','Apenas o administrador pode importar ou restaurar disciplinas. O conteúdo ativo só muda após sua confirmação.','muted'));
 const back=el('button','Voltar','btn secondary');back.onclick=()=>window.home();panel.append(back);
 const current=el('div',undefined,'notice');current.append(el('div','DISCIPLINA ATIVA','eyebrow'),el('h2',active.data.discipline),el('p',`${countQs(window.OSM_DATA)} questões · ${window.OSM_DATA.modules.length} quizzes · ${window.OSM_DATA.simulations.length} simulados`));panel.append(current);
 panel.append(el('h2','Importar nova disciplina'),el('p','Selecione o arquivo JSON preparado para esta plataforma. A disciplina atual será arquivada automaticamente se a importação for confirmada.','small muted'));
 const name=el('input');name.type='text';name.maxLength=100;name.placeholder='Nome da nova disciplina';name.setAttribute('aria-label','Nome da nova disciplina');name.style.cssText='display:block;width:100%;padding:12px;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)';
 const file=el('input');file.type='file';file.accept='.json,application/json';file.setAttribute('aria-label','Arquivo JSON da disciplina');file.style.cssText='display:block;max-width:100%;margin:12px 0';
 const note=el('p','Nenhum arquivo selecionado.','small muted');note.setAttribute('role','status');const activate=el('button','Arquivar atual e ativar nova','btn full');activate.disabled=true;panel.append(name,file,note,activate);
 let data=null,busy=false,selection=0;
 function enable(){activate.disabled=busy||!data||!name.value.trim();}
 name.oninput=enable;file.onchange=async()=>{const token=++selection;data=null;enable();const f=file.files[0];if(!f){note.textContent='Nenhum arquivo selecionado.';return;}try{if(f.size>5000000)throw Error('Arquivo acima de 5 MB.');const parsed=JSON.parse(await f.text());const p=parsed.payload||parsed;if(!Array.isArray(p.modules)||!p.modules.length||!Array.isArray(p.simulations)||!p.simulations.length||![...p.modules,...p.simulations].every(m=>Array.isArray(m.questions)&&m.questions.length))throw Error('Formato incompatível.');if(token!==selection)return;data=p;if(typeof parsed.discipline==='string')name.value=parsed.discipline.slice(0,100);note.textContent=`Arquivo lido: ${countQs(p)} questões, ${p.modules.length} quizzes e ${p.simulations.length} simulados. A validação definitiva será feita pelo banco.`;}catch(e){if(token!==selection)return;note.textContent='Arquivo inválido: '+e.message;}enable();};
 async function change(discipline,payload,restore){if(busy)return;if(!confirm(`Ativar ${discipline}? A disciplina atual será arquivada. Os estudantes aprovados passarão a acessar o novo conteúdo.`))return;busy=true;enable();note.textContent='Validando e salvando...';const r=await client.rpc('osm_switch_content',{p_expected:active.data.revision,p_discipline:discipline,p_payload:payload,p_restore:restore});if(r.error){busy=false;note.textContent='Nenhuma troca confirmada: '+r.error.message;enable();return;}alert('Disciplina ativada. A página será atualizada.');invalidate();}
 activate.onclick=()=>{if(data&&name.value.trim())change(name.value.trim(),data,null);};
 panel.append(el('hr'),el('h2','Disciplinas arquivadas'));
 if(!archive.data.length)panel.append(el('p','Nenhuma disciplina arquivada. O conteúdo atual permanece ativo.','muted'));
 for(const item of archive.data){const row=el('div',undefined,'adminline');row.append(el('strong',item.discipline),el('p','Arquivada em '+new Date(item.archived_at).toLocaleString('pt-BR'),'small muted'));const b=el('button','Restaurar disciplina','btn secondary');b.onclick=()=>change(item.discipline,null,item.archive_id);row.append(b);panel.append(row);}
}

async function check(silent=false){if(checking||reloading)return;checking=true;try{const u=await bounded(client.auth.getUser());if(reloading)return;if(u.error||!u.data?.user){if(launched){if(isSessionRejected(u.error)||!u.error)invalidate(true);else retryConnection();}else{exit.hidden=true;adminBtn.hidden=true;contentBtn.hidden=true;if(!silent)login();}return;}if(launched&&user?.id!==u.data.user.id){invalidate(true);return;}user=u.data.user;exit.hidden=false;const [req,role]=await bounded(Promise.all([client.rpc('osm_request_access'),client.from('osm_admins').select('user_id').eq('user_id',user.id).maybeSingle()]));if(reloading)return;if(req.error||role.error)throw (req.error||role.error);admin=!!role.data;adminBtn.hidden=!admin;const r=await bounded(client.from('osm_requests').select('status,name').eq('user_id',user.id).single());if(reloading)return;if(r.error)throw r.error;contentBtn.hidden=!(admin&&r.data.status==='approved');if(r.data.status!=='approved'){if(launched){invalidate(true);return;}if(!silent)message(labels[r.data.status],r.data.status==='pending'?'Seu cadastro foi recebido. Aguarde a autorização do administrador.':'Seu acesso não está liberado. Entre em contato com o administrador.',true);return;}if(launched){const v=await bounded(client.from('osm_content').select('revision').eq('id',1).single());if(reloading)return;if(v.error)throw v.error;if(!v.data?.revision)throw new Error('missing_revision');if(v.data.revision!==activeRevision)invalidate();else clearRetry();return;}const content=await bounded(client.from('osm_content').select('payload,discipline,content_key,revision').eq('id',1).single());if(reloading)return;if(content.error||!content.data?.payload)throw (content.error||new Error('content'));window.OSM_DATA=content.data.payload;window.OSM_USER_ID=user.id;window.OSM_USER_NAME=r.data.name;window.OSM_DISCIPLINE=content.data.discipline;window.OSM_CONTENT_KEY=content.data.content_key;activeRevision=content.data.revision;const disciplineLabel=window.OSM_DISCIPLINE==='Organização, Sistemas e Métodos'?'OSM':window.OSM_DISCIPLINE;$('discipline-label').textContent='Administração · '+disciplineLabel;document.title='Plataforma de Ensino Mateus | '+disciplineLabel;$('discipline-footer').textContent='Material de apoio independente. Não é uma avaliação oficial da instituição.';const script=document.createElement('script');script.textContent=$('osm-app-code').textContent;document.body.append(script);$('theme').hidden=false;launched=true;clearRetry();}catch(e){if(launched){if(isSessionRejected(e))invalidate(true);else retryConnection();}else if(!silent)message('Não foi possível verificar o acesso','Confira sua conexão ou tente novamente.',true);}finally{checking=false;}}
client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&launched){invalidate(true);return;}if(['INITIAL_SESSION','SIGNED_IN','USER_UPDATED'].includes(event))setTimeout(()=>check(),0);});tick=setInterval(()=>{if(user&&!retryTimer)check(true);},30000);window.addEventListener('online',()=>{if(launched&&!reloading){clearTimeout(retryTimer);retryTimer=0;check(true)}});check();
})();
